name: Refresh posters

# Looks up every title's poster on TMDB and commits src/data/posters.json.
# Runs by hand from the Actions tab, and every four months on its own, which keeps
# the data inside TMDB's 6-month limit. Needs the repository secret TMDB_TOKEN.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 1,5,9 *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run posters
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - run: npm run validate
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/posters.json
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Refresh TMDB poster data"
          git push
